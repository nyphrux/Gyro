# Runs the unit tests and builds a debug APK for every push to master and every pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # gradlew was committed from Windows without the executable bit.
      - run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gyro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
