# Builds a signed release APK when a version tag (e.g. 1.1.0 or 1.2.0-beta.1) is pushed, and
# attaches it to a *draft* GitHub release. Review the notes, then press Publish: only published,
# non-pre-release releases are offered by Gyro's in-app updater.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GYRO_KEYSTORE_BASE64     base64 of your release .jks   (base64 -w0 gyro-release.jks)
#   GYRO_KEYSTORE_PASSWORD
#   GYRO_KEY_ALIAS
#   GYRO_KEY_PASSWORD
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches gyro.versionName
        id: version
        run: |
          version="$(grep -E '^gyro\.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match gyro.versionName '$version' in gradle.properties."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Decode signing key
        env:
          GYRO_KEYSTORE_BASE64: ${{ secrets.GYRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GYRO_KEYSTORE_BASE64" ]; then
            echo "::error::The GYRO_KEYSTORE_BASE64 secret is not set, so the APK cannot be signed."
            exit 1
          fi
          echo "$GYRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gyro-release.jks"
          echo "GYRO_KEYSTORE_FILE=$RUNNER_TEMP/gyro-release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          GYRO_KEYSTORE_PASSWORD: ${{ secrets.GYRO_KEYSTORE_PASSWORD }}
          GYRO_KEY_ALIAS: ${{ secrets.GYRO_KEY_ALIAS }}
          GYRO_KEY_PASSWORD: ${{ secrets.GYRO_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Verify signature and name the APK
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/Gyro-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum "Gyro-${{ steps.version.outputs.version }}.apk" > "Gyro-${{ steps.version.outputs.version }}.apk.sha256")

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Gyro ${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/Gyro-${{ steps.version.outputs.version }}.apk
            dist/Gyro-${{ steps.version.outputs.version }}.apk.sha256

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gyro-release.jks"
